worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # Avoid recording query strings, including legacy token URL parameters.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream homehero_frontend {
        server frontend:3000;
    }
    upstream homehero_backend {
        server backend:3007;
    }

    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://187.127.209.174$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name 187.127.209.174;
        ssl_certificate /etc/letsencrypt/live/homehero-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/homehero-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        # Backend permits ten files of up to 15,000,000 bytes each.
        client_max_body_size 160m;
        client_body_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location = /graphql {
            proxy_pass http://homehero_backend;
        }

        location = /ws {
            proxy_pass http://homehero_backend;
            # Repeat inherited headers: local proxy_set_header replaces inheritance.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /uploads/ {
            proxy_pass http://homehero_backend;
        }

        location / {
            proxy_pass http://homehero_frontend;
        }
    }
}
