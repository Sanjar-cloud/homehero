name: homehero

services:
  backend:
    image: homehero-backend:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT_API: "3007"
      MONGO_PROD: ${MONGO_PROD:?Set the approved portfolio database URI}
      SECRET_TOKEN: ${SECRET_TOKEN:?Set a dedicated deployment JWT secret}
    volumes:
      - uploads:/app/uploads
    expose:
      - "3007"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: &app-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: homehero-frontend:${RELEASE_TAG:-local}
    build:
      context: ../../homehero-next
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${PUBLIC_ORIGIN:?Set the public browser origin without a trailing slash}
        REACT_APP_API_GRAPHQL_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/graphql
        REACT_APP_API_WS: ${PUBLIC_WS_URL:?Set the matching public WebSocket URL ending in /ws}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *app-logging

  nginx:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Keep the local diagnostic port; public HTTP serves ACME/redirects only.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/homehero-acme:/var/www/certbot:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *app-logging

volumes:
  uploads:
    name: homehero_uploads
